
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111820" id="themeColorMeta" />

  <title>MIZAN | تسجيل الدخول</title>

  <link rel="icon" href="../pic/Mizan Logo 02.png" />
  <link rel="stylesheet" href="login.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen text-white antialiased">

  <main class="login-bg relative flex min-h-screen flex-col overflow-hidden">

    <!-- Header -->
    <header class="relative z-10 border-b border-mizan-gold px-5 py-5 text-center sm:py-6">

      <button
        id="themeToggle"
        type="button"
        class="theme-toggle absolute left-4 top-1/2 inline-flex -translate-y-1/2 items-center gap-2 rounded-full px-3 py-2 text-sm transition sm:left-6"
        aria-label="التبديل إلى الوضع الفاتح"
        title="تغيير المظهر"
      >
        <svg
          id="themeIcon"
          viewBox="0 0 24 24"
          class="h-5 w-5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
        </svg>

        <span id="themeLabel" class="hidden sm:inline">الوضع الفاتح</span>
      </button>

      <h1 class="text-xl font-normal tracking-wide text-mizan-muted sm:text-2xl md:text-3xl">
        من فضلك سجل دخولك باستخدام بيانات حسابك
      </h1>

    </header>

    <!-- Main Content -->
    <section
      dir="ltr"
      class="relative z-10 mx-auto grid w-full max-w-[1500px] flex-1 grid-cols-1 items-center gap-12 px-5 py-10 sm:px-10 lg:grid-cols-2 lg:gap-16 lg:px-16 xl:px-24"
    >

      <!-- LEFT SIDE: Login Form -->
      <div class="order-1 mx-auto w-full max-w-[520px]">

        <!-- Profile Icon -->
        <div
          class="relative mb-10 flex items-center justify-center"
          aria-hidden="true"
        >
          <div class="profile-circle relative flex h-36 w-36 items-center justify-center rounded-full border sm:h-44 sm:w-44">

            <svg
              viewBox="0 0 100 100"
              class="h-24 w-24 sm:h-28 sm:w-28"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <circle cx="50" cy="31" r="15"></circle>

              <path
                d="M20 78c2-19 14-30 30-30s28 11 30 30c.2 2-1 3-3 3H23c-2 0-3-1-3-3Z"
                stroke-linejoin="round"
              ></path>
            </svg>

          </div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-6" novalidate dir="ltr">

          <!-- Username -->
          <div>

            <label for="username" class="sr-only">اسم المستخدم</label>

            <div class="field flex h-[62px] overflow-hidden rounded-lg sm:h-[72px]">

              <span class="flex w-[76px] shrink-0 items-center justify-center border-l">

                <svg
                  viewBox="0 0 32 32"
                  class="h-8 w-8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.15"
                  aria-hidden="true"
                >
                  <circle cx="16" cy="9" r="6"></circle>

                  <path
                    d="M3 28c1-8 6-13 13-13s12 5 13 13H3Z"
                    stroke-linejoin="round"
                  ></path>
                </svg>

              </span>

              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                placeholder="USERNAME"
                class="min-w-0 flex-1 bg-transparent px-5 text-lg outline-none sm:px-7 sm:text-xl"
                required
              />

            </div>

            <p id="usernameError" class="mt-2 hidden text-sm text-rose-400">
              من فضلك أدخل اسم المستخدم.
            </p>

          </div>

          <!-- Password -->
          <div>

            <label for="password" class="sr-only">كلمة المرور</label>

            <div class="field flex h-[62px] overflow-hidden rounded-lg sm:h-[72px]">

              <span class="flex w-[76px] shrink-0 items-center justify-center border-l">

                <svg
                  viewBox="0 0 32 32"
                  class="h-8 w-8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect x="5" y="13" width="22" height="16" rx="2"></rect>
                  <path d="M9 13V9a7 7 0 0 1 14 0v4"></path>
                  <circle cx="16" cy="20" r="1.7"></circle>
                  <path d="M16 22v3"></path>
                </svg>

              </span>

              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
                class="min-w-0 flex-1 bg-transparent px-5 text-lg tracking-widest outline-none sm:px-7 sm:text-xl"
                required
              />

              <!-- Show / Hide Password -->
              <button
                id="togglePassword"
                type="button"
                class="password-toggle px-4 text-sm transition focus:outline-none"
                aria-label="إظهار كلمة المرور"
                title="إظهار أو إخفاء كلمة المرور"
              >
                <svg
                  id="eyeIcon"
                  viewBox="0 0 24 24"
                  class="h-6 w-6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>

            </div>

            <p id="passwordError" class="mt-2 hidden text-sm text-rose-400">
              من فضلك أدخل كلمة المرور.
            </p>

          </div>

          <!-- Login Button -->
          <button
            id="loginButton"
            type="submit"
            class="gold-button flex h-[62px] w-full items-center justify-center rounded-lg text-xl font-medium shadow-lg transition-all duration-200 focus:outline-none focus:ring-4 sm:h-[72px] sm:text-2xl"
          >

            <span id="loginButtonText">LOGIN</span>

            <svg
              id="loginSpinner"
              class="mr-3 hidden h-5 w-5 animate-spin"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <circle
                class="opacity-30"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>

              <path
                class="opacity-90"
                fill="currentColor"
                d="M4 12a8 8 0 0 1 8-8V0C5.37 0 0 5.37 0 12h4Z"
                transform="translate(2 2)"
              ></path>
            </svg>

          </button>

          <!-- Divider -->
          <div class="form-divider h-px w-4/5"></div>

          <!-- Remember Me / Forgot Password -->
          <div class="flex flex-wrap items-center justify-between gap-4 pt-1 text-sm tracking-wide sm:text-base">

            <label class="remember-label inline-flex cursor-pointer items-center gap-3">

              <input
                id="rememberMe"
                type="checkbox"
                class="peer sr-only"
                checked
              />

              <span class="remember-box flex h-8 w-8 items-center justify-center rounded-md border bg-transparent text-transparent transition peer-checked:text-amber-500 peer-focus-visible:ring-2">

                <svg
                  viewBox="0 0 24 24"
                  class="h-5 w-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                >
                  <path
                    d="m4 12 5 5L20 5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </svg>

              </span>

              <span>Remember me</span>

            </label>

            <button
              id="forgotPassword"
              type="button"
              class="text-left underline-offset-4 transition hover:underline"
            >
              Forgot your password?
            </button>

          </div>

          <!-- Form Status -->
          <p
            id="formMessage"
            class="hidden rounded-lg border px-4 py-3 text-sm"
            role="status"
            aria-live="polite"
          ></p>

        </form>

      </div>

      <!-- RIGHT SIDE: Mizan Logo -->
      <div dir="rtl" class="order-2 flex w-full items-center justify-center">

        <img
          id="mizanLogo"
          src="../pic/Mizan Logo 02.png"
          class="mizan-logo h-auto w-full max-w-[320px] object-contain sm:max-w-[400px] lg:max-w-[460px]"
          alt="MIZAN لإدارة مكاتب المحاماة"
        />

      </div>

    </section>

    <!-- Toast Notification -->
    <div
      id="toast"
      class="toast fixed bottom-5 left-1/2 z-[60] hidden -translate-x-1/2 rounded-xl border px-5 py-3 text-center text-sm shadow-xl"
      role="status"
      aria-live="polite"
    ></div>

    <!-- Forgot Password Modal -->
    <div
      id="forgotModal"
      class="modal-overlay fixed inset-0 z-[100] hidden items-center justify-center bg-black/60 px-4 backdrop-blur-sm"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >

      <div class="modal-panel relative w-full max-w-md rounded-2xl border p-6 shadow-2xl sm:p-8">

        <button
          id="closeModal"
          type="button"
          class="modal-close absolute left-4 top-4 text-2xl"
          aria-label="إغلاق"
        >
          &times;
        </button>

        <h2 id="modalTitle" class="mb-3 text-xl font-bold">
          استعادة كلمة المرور
        </h2>

        <p class="modal-copy mb-6 text-sm leading-7">
          أدخل بريدك الإلكتروني المرتبط بحسابك لاستعادة كلمة المرور.
        </p>

        <form id="resetForm" class="space-y-4" novalidate>

          <label for="email" class="modal-label block text-sm">
            البريد الإلكتروني
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="example@email.com"
            class="modal-input w-full rounded-lg px-4 py-3 outline-none"
            required
          />

          <p id="emailError" class="hidden text-sm text-rose-500">
            من فضلك أدخل بريدًا إلكترونيًا صحيحًا.
          </p>

          <button
            type="submit"
            class="gold-button w-full rounded-lg px-5 py-3 font-semibold"
          >
            إرسال رابط الاستعادة
          </button>

          <p
            id="resetMessage"
            class="hidden rounded-lg border border-emerald-500/30 bg-emerald-500/10 p-3 text-sm text-emerald-500"
            role="status"
          ></p>

        </form>

      </div>

    </div>

  </main>

  <script src="login.js"></script>

</body>
</html>
