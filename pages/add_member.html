<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../style/add_member.css" />
    <link rel="stylesheet" href="../style/modal-system.css" />
    <link rel="icon" href="../pic/Mizan Logo 02.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f7ff" />
    <title>المستخدمين | MIZAN</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="../script/unified-navbar.js"></script>
    <script src="../script/mizan-data.js"></script>
    <link rel="stylesheet" href="../style/number-format.css" />
    <script src="../script/number-utils.js"></script>
  </head>

  <body class="min-h-screen px-4 pb-10">
    <!-- TopAppBar -->
    <header
      class="fixed top-0 left-0 z-40 flex h-20 items-center justify-between border-b border-sky-100/70 bg-white/90 px-4 shadow-sm shadow-sky-900/5 backdrop-blur-xl right-0 md:px-8"
    >
      <a class="brand-link" href="../index.html" aria-label="ميزان - الصفحة الرئيسية">
        <img src="../pic/Mizan Logo 02.png" alt="" />
        <span>ميزان</span>
      </a>

      <div class="flex items-center gap-3">
        <a
          href="../index.html"
          class="home-link"
          title="الصفحة الرئيسية"
          aria-label="العودة إلى الصفحة الرئيسية"
        >
          <span class="material-symbols-outlined" aria-hidden="true">home</span>
        </a>
      </div>
    </header>

    <!-- Notifications Overlay + Popup (same as index) -->
    <div
      id="overlay"
      class="fixed inset-0 z-50 hidden opacity-0 transition-opacity bg-black/20 backdrop-blur-sm mizan-overlay"
      aria-hidden="true"
    ></div>

    <div
      id="modal"
      class="fixed inset-0 z-[60] hidden opacity-0 scale-95 transition-all duration-300 flex items-start justify-center pt-24"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div
        class="w-full max-w-md bg-white/90 backdrop-blur-xl rounded-2xl shadow-xl border border-sky-100/60 overflow-hidden mizan-modal mizan-modal--sm"
      >
        <div
          class="modal-head flex items-center justify-between p-5 border-b border-sky-100/60"
        >
          <h3 id="modalTitle" class="text-lg font-bold text-on-background">
            الإشعارات
          </h3>
          <button
            type="button"
            id="closeModalBtn"
            class="p-2 rounded-full hover:bg-sky-50 text-slate-600"
            aria-label="إغلاق"
          >
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>

        <div id="modalContent" class="notification-content p-5 text-sm text-on-background">
          <!-- content injected by notifications.js -->
        </div>
      </div>
    </div>

    <main class="page-shell mx-auto w-full max-w-5xl">
      <!-- ================= Skeleton Loader ================= -->
      <div id="skeletonLoader" class="space-y-8">
        <!-- Header -->
        <div class="text-center space-y-4">
          <div class="skeleton h-10 w-72 rounded-xl mx-auto"></div>
          <div class="skeleton h-4 w-80 rounded mx-auto"></div>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-[35px] p-5 md:p-10 shadow-sm">
          <!-- Inputs -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
            <div class="space-y-3">
              <div class="skeleton h-4 w-24 rounded"></div>
              <div class="skeleton h-14 rounded-2xl"></div>
            </div>

            <div class="space-y-3">
              <div class="skeleton h-4 w-24 rounded"></div>
              <div class="skeleton h-14 rounded-2xl"></div>
            </div>
          </div>

          <!-- Password -->
          <div class="space-y-3 mb-8">
            <div class="skeleton h-4 w-32 rounded"></div>
            <div class="skeleton h-14 rounded-2xl"></div>
          </div>

          <!-- Permissions -->
          <div class="space-y-5">
            <div class="skeleton h-5 w-32 rounded"></div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              <div class="skeleton h-16 rounded-2xl"></div>
              <div class="skeleton h-16 rounded-2xl"></div>
              <div class="skeleton h-16 rounded-2xl"></div>
              <div class="skeleton h-16 rounded-2xl"></div>
              <div class="skeleton h-16 rounded-2xl"></div>
              <div class="skeleton h-16 rounded-2xl"></div>
            </div>
          </div>

          <!-- Buttons -->
          <div class="flex justify-center gap-4 mt-10">
            <div class="skeleton h-14 w-40 rounded-full"></div>
            <div class="skeleton h-14 w-40 rounded-full"></div>
          </div>
        </div>
      </div>

      <!-- ================= Real Content ================= -->
      <div id="realContent" class="hidden">
        <!-- Header -->
        <div class="text-center mb-8">
          <h1 class="text-3xl md:text-5xl mt-10 font-extrabold text-slate-800 mb-2">
            إضافة مستخدم جديد
          </h1>

          <p class="text-slate-500 text-sm md:text-base">
            قم بتعبئة البيانات لإنشاء حساب مستخدم جديد
          </p>
        </div>

        <!-- Card -->
        <div
          class="bg-white rounded-[35px] shadow-sm p-5 md:p-10 border border-slate-100"
        >
          <!-- Form -->
          <form id="memberForm" class="space-y-8" novalidate>
            <!-- Inputs -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <!-- Full Name -->
              <div>
                <label for="fullName" class="block text-slate-700 font-bold mb-3 text-sm">
                  الاسم الكامل
                </label>

                <div
                  class="flex items-center bg-slate-100 rounded-2xl px-4 h-14"
                >
                  <span class="material-symbols-outlined text-sky-600" aria-hidden="true">person</span>

                  <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="ادخل الاسم الكامل"
                    class="w-full bg-transparent outline-none px-3 text-sm"
                    autocomplete="name"
                    required
                  />
                </div>
              </div>

              <div>
                <label for="username" class="block text-slate-700 font-bold mb-3 text-sm">
                  اسم المستخدم
                </label>
                <div class="flex items-center bg-slate-100 rounded-2xl px-4 h-14">
                  <span class="material-symbols-outlined text-sky-600" aria-hidden="true">alternate_email</span>
                  <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="اختر اسم مستخدم"
                    class="w-full bg-transparent outline-none px-3 text-sm"
                    autocomplete="username"
                    required
                  />
                </div>
              </div>

              <div class="md:col-span-2">
                <label for="jobPositionSearch" class="block text-slate-700 font-bold mb-3 text-sm">
                  المسمى الوظيفي
                </label>
                <div class="flex items-center bg-slate-100 rounded-2xl px-4 h-14 gap-2">
                  <span class="material-symbols-outlined text-sky-600" aria-hidden="true">work</span>
                  <input
                    type="search"
                    id="jobPositionSearch"
                    placeholder="ابحث عن المسمى الوظيفي..."
                    class="w-full bg-transparent outline-none px-1 text-sm"
                    aria-label="بحث المسمى الوظيفي"
                    autocomplete="off"
                  />
                </div>
                <select
                  id="jobPosition"
                  name="jobPosition"
                  class="mt-3 w-full h-14 bg-slate-100 rounded-2xl px-4 text-sm outline-none border-0"
                  required
                ></select>
                <p class="mt-2 text-xs text-slate-500">اختر المسمى الوظيفي من القائمة المركزية.</p>
              </div>

              <!-- Password -->
              <div class="md:col-span-2">
              <label class="block text-slate-700 font-bold mb-3 text-sm">
                كلمة المرور
              </label>

              <div class="flex items-center bg-slate-100 rounded-2xl px-4 h-14">
                <button
                  title="password"
                  type="button"
                  id="togglePassword"
                  class="text-slate-500"
                  aria-label="إظهار كلمة المرور"
                  aria-pressed="false"
                >
                  <span class="material-symbols-outlined" aria-hidden="true">visibility</span>
                </button>

                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="********"
                  class="w-full bg-transparent outline-none px-3 text-sm"
                  autocomplete="new-password"
                  minlength="8"
                  required
                />

                <span class="material-symbols-outlined text-sky-600" aria-hidden="true">lock</span>
              </div>
              <p class="mt-2 text-xs text-slate-500">يجب ألا تقل كلمة المرور عن 8 أحرف.</p>
            </div>
            </div>

            <!-- Permissions -->
            <div>
              <div
                class="flex items-center gap-3 mb-6 border-b border-sky-100 pb-3"
              >
                <div class="flex-1 border-b border-sky-200"></div>

                <div class="flex-1 border-b border-sky-200"></div>

                <h2 id="permissionsHeading" class="font-extrabold text-slate-700">الصلاحيات</h2>
              </div>
              <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
                <p id="permissionsCount" class="text-sm text-slate-500" aria-live="polite">تم اختيار 0 من 18 صلاحية</p>
                <div class="flex gap-2">
                  <button id="selectAllPermissions" class="secondary-action" type="button">تحديد الكل</button>
                  <button id="clearPermissions" class="secondary-action" type="button">إلغاء التحديد</button>
                </div>
              </div>

              <!-- Permissions Grid -->
              <div
                id="permissionsContainer"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"
                aria-labelledby="permissionsHeading"
              ></div>
            </div>

            <p id="formMessage" class="form-message hidden" role="status" aria-live="polite"></p>

            <!-- Buttons -->
            <div
              class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-5"
            >
              <a
                href="../index.html"
                class="flex h-14 w-full items-center justify-center rounded-full bg-sky-100 font-bold text-slate-700 duration-300 hover:scale-105 sm:w-48"
              >إلغاء والعودة</a>
              <button
                type="submit"
                class="w-full sm:w-48 h-14 rounded-full bg-sky-500 text-white font-bold shadow-lg shadow-sky-200 hover:bg-sky-600 hover:scale-105 duration-300"
              >
                حفظ البيانات
              </button>
            </div>
          </form>
        </div>
        <!-- Footer -->
        <div class="text-center mt-6 text-slate-400 text-sm">
          <span class="material-symbols-outlined align-middle" aria-hidden="true">shield_lock</span>

          يتم تشفير جميع كلمات المرور بشكل آمن
        </div>
      </div>
      </main>
    </div>

    <script src="../script/add_member.js"></script>
    <script src="../script/notifications.js"></script>
  </body>
</html>
